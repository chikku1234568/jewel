[project]
name = "jewel"
version = "0.0.2"
description = "jewel: a personal live knowledge graph over your own documents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Srikar Sribhashyam" }]
license = { text = "Proprietary (private repository; licence TBD)" }
# Runtime dependencies. The Neo4j driver is declared because the graph store is decided
# (ADR 0011) but nothing imports it yet.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.20",  # graph store, declared only (not imported yet)
    "psycopg[binary]>=3.2",  # Postgres: users, sessions, documents (jewel.db)
    "pypdf>=6.19.0",  # PDF text extraction and page count (jewel.parsing.pdf)
    "python-docx>=1.2.0",  # .docx text extraction (jewel.parsing.docx)
    "python-multipart>=0.0.32",  # multipart uploads for POST /documents
    "pyjwt[crypto]>=2.15.0",  # Google ID token verification (jewel.auth.google)
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jewel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
