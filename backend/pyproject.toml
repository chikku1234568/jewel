[project]
name = "jewel"
version = "0.0.2"
description = "jewel: a personal live knowledge graph over your own documents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Srikar Sribhashyam" }]
license = { text = "Proprietary (private repository; licence TBD)" }
# Runtime dependencies. The Neo4j driver is declared because the graph store is decided
# (ADR 0011) but nothing imports it yet.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.20",  # graph store, declared only (not imported yet)
    "psycopg[binary]>=3.2",  # Postgres: users, sessions, documents (jewel.db)
    "pypdf>=6.19.0",  # PDF page count and password check before conversion (jewel.parsing.pdf)
    "python-multipart>=0.0.32",  # multipart uploads for POST /documents
    "pyjwt[crypto]>=2.15.0",  # Google ID token verification (jewel.auth.google)
    "networkx>=3.3",  # graph for Personalized PageRank; the walk itself is local
    "fastembed>=0.7",  # local BAAI/bge-base-en-v1.5 embeddings
    # Upload -> Markdown for .pdf/.docx/.pptx/.xlsx/.html (jewel.parsing.markdown)
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.8",
    # The answer agent: create_agent hosts search_graph/read_document (jewel.agents.graph)
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
    "python-docx>=1.2.0",  # builds .docx test fixtures (tests/fixtures.py)
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jewel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
