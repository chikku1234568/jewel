[project]
name = "jewel"
version = "0.0.2"
description = "jewel: a personal live knowledge graph over your own documents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Srikar Sribhashyam" }]
license = { text = "Proprietary (private repository; licence TBD)" }
# Only libraries the scaffold imports, plus the clients for the two decided stores.
# The Neo4j driver and the Postgres client are declared because the stores are decided
# (ADR 0011, ADR 0009); no stub imports them yet.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.20",  # graph store, declared only (not imported yet)
    "psycopg[binary]>=3.2",  # app data in Postgres, declared only (not imported yet)
    "networkx>=3.3",  # graph for Personalized PageRank; the walk itself is local
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jewel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
