[project]
name = "jewel"
version = "0.0.1"
description = "Pharmacotherapy regimen lab alert: a temporal-knowledge-graph showcase (synthetic data, not for clinical use)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Srikar Sribhashyam" }]
license = { text = "Proprietary (private showcase; licence TBD)" }
# Step 1: what is needed to import the stubs and serve /health, plus the clients for the
# two accepted decisions (neo4j driver, redis-py). Stubs do not import them yet.
# Planned runtime dependencies (added in the step that first needs them, see docs/architecture.md):
#   langgraph            - agent orchestration (architecture section 4)
#   networkx or python-igraph (or Neo4j GDS, no Python dep) - query-time PPR (ADR 0004)
#   pypdf / pdfplumber / docling - document parsing behind parsing.base.DocumentParser
#   an LLM + embedding SDK behind llm.base (provider not chosen yet)
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.20",  # ADR 0002 (Accepted): Neo4j 5.x Community
    "redis>=5.0",  # ADR 0003 (Accepted): Redis
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jewel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
