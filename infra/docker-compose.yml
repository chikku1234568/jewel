# Local development stack (placeholder). No cache service in this version.
# Usage from the repo root:  docker compose -f infra/docker-compose.yml --env-file .env up --build
name: jewel

services:
  neo4j:
    image: neo4j:5.26-community # 5.x LTS line, Community Edition (ADR 0011)
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-please}
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-change-me-please} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17-alpine # app data (ADR 0009)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jewel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jewel}
      POSTGRES_DB: ${POSTGRES_DB:-jewel}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jewel} -d ${POSTGRES_DB:-jewel}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
    environment:
      JEWEL_ENV: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-jewel}:${POSTGRES_PASSWORD:-jewel}@postgres:5432/${POSTGRES_DB:-jewel}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-please}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:-}
      JEWEL_LLM_MODEL: ${JEWEL_LLM_MODEL:-}
      JEWEL_EMBEDDING_MODEL: ${JEWEL_EMBEDDING_MODEL:-}
      JEWEL_UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads # uploaded file bytes (local volume)
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  neo4j_data:
  pg_data:
  uploads:
