name: CI

# ADR 0015. main is the deploy branch. CI runs on main and on pull requests into main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres for the auth and documents tests; conftest fails (never skips) in CI
    # when JEWEL_TEST_DATABASE_URL is missing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jewel
          POSTGRES_PASSWORD: jewel
          POSTGRES_DB: jewel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jewel -d jewel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JEWEL_TEST_DATABASE_URL: postgresql://jewel:jewel@localhost:5432/jewel_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag is published for v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
